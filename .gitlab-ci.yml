# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/ee/user/application_security/sast/#customizing-the-sast-settings
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure
# Dependency Scanning customization: https://docs.gitlab.com/ee/user/application_security/dependency_scanning/#customizing-the-dependency-scanning-settings
# Container Scanning customization: https://docs.gitlab.com/ee/user/application_security/container_scanning/#customizing-the-container-scanning-settings
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ee/ci/variables/#cicd-variable-precedence
:include:
- :template: Security/SAST.gitlab-ci.yml
- :template: Security/Secret-Detection.gitlab-ci.yml
- :template: Jobs/Container-Scanning.gitlab-ci.yml
:stages:
- test
- build
- scan
- deploy
:variables:
  :PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  :DOCKER_DRIVER: overlay2
  :DOCKER_BUILDKIT: '1'
:cache:
  :key: pip-cache
  :paths:
  - ".pip-cache/"
:unit_tests:
  :stage: test
  :image: python:3.12-slim
  :rules:
  - :if: $CI_COMMIT_BRANCH == "main"
  :before_script:
  - python -m pip install --upgrade pip
  - pip install -e "ids_iforest_package[test]"
  :script:
  - cd ids_iforest_package
  - pytest -q --cov=ids_iforest --cov-report=xml:../coverage.xml --cov-report=html:../htmlcov
  :artifacts:
    :reports:
      :coverage_report:
        :coverage_format: cobertura
        :path: coverage.xml
    :paths:
    - coverage.xml
    - htmlcov/
    :expire_in: 1 week
:.docker-build:
  :image: docker:24.0.5
  :services:
  - docker:24.0.5-dind
  :variables:
    :DOCKER_HOST: tcp://docker:2376
    :DOCKER_TLS_CERTDIR: "/certs"
  :before_script:
  - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER"
    --password-stdin
  :rules:
  - :if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG
  :retry:
    :max: 2
    :when:
    - runner_system_failure
    - scheduler_failure
    - data_integrity_failure
:build_attacker:
  :image: docker:24.0.5
  :services:
  - docker:24.0.5-dind
  :variables:
    :DOCKER_HOST: tcp://docker:2376
    :DOCKER_TLS_CERTDIR: "/certs"
  :before_script:
  - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER"
    --password-stdin
  :rules:
  - :if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG
  :retry:
    :max: 2
    :when:
    - runner_system_failure
    - scheduler_failure
    - data_integrity_failure
  :stage: build
  :script:
  - docker build --pull -t "$CI_REGISTRY_IMAGE/attacker:${CI_COMMIT_SHORT_SHA}" services/attacker
  - if [ -z "$CI_COMMIT_TAG" ]; then docker tag "$CI_REGISTRY_IMAGE/attacker:${CI_COMMIT_SHORT_SHA}"
    "$CI_REGISTRY_IMAGE/attacker:latest"; fi
  - docker push "$CI_REGISTRY_IMAGE/attacker:${CI_COMMIT_SHORT_SHA}"
  - if [ -z "$CI_COMMIT_TAG" ]; then docker push "$CI_REGISTRY_IMAGE/attacker:latest";
    fi
  - if [ -n "$CI_COMMIT_TAG" ]; then docker tag "$CI_REGISTRY_IMAGE/attacker:${CI_COMMIT_SHORT_SHA}"
    "$CI_REGISTRY_IMAGE/attacker:${CI_COMMIT_TAG}"; fi
  - if [ -n "$CI_COMMIT_TAG" ]; then docker push "$CI_REGISTRY_IMAGE/attacker:${CI_COMMIT_TAG}";
    fi
:build_ids:
  :image: docker:24.0.5
  :services:
  - docker:24.0.5-dind
  :variables:
    :DOCKER_HOST: tcp://docker:2376
    :DOCKER_TLS_CERTDIR: "/certs"
  :before_script:
  - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER"
    --password-stdin
  :rules:
  - :if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG
  :retry:
    :max: 2
    :when:
    - runner_system_failure
    - scheduler_failure
    - data_integrity_failure
  :stage: build
  :script:
  - docker build --pull -f services/ids/Dockerfile -t "$CI_REGISTRY_IMAGE/ids:${CI_COMMIT_SHORT_SHA}"
    .
  - if [ -z "$CI_COMMIT_TAG" ]; then docker tag "$CI_REGISTRY_IMAGE/ids:${CI_COMMIT_SHORT_SHA}"
    "$CI_REGISTRY_IMAGE/ids:latest"; fi
  - docker push "$CI_REGISTRY_IMAGE/ids:${CI_COMMIT_SHORT_SHA}"
  - if [ -z "$CI_COMMIT_TAG" ]; then docker push "$CI_REGISTRY_IMAGE/ids:latest";
    fi
  - if [ -n "$CI_COMMIT_TAG" ]; then docker tag "$CI_REGISTRY_IMAGE/ids:${CI_COMMIT_SHORT_SHA}"
    "$CI_REGISTRY_IMAGE/ids:${CI_COMMIT_TAG}"; fi
  - if [ -n "$CI_COMMIT_TAG" ]; then docker push "$CI_REGISTRY_IMAGE/ids:${CI_COMMIT_TAG}";
    fi
:build_web:
  :image: docker:24.0.5
  :services:
  - docker:24.0.5-dind
  :variables:
    :DOCKER_HOST: tcp://docker:2376
    :DOCKER_TLS_CERTDIR: "/certs"
  :before_script:
  - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER"
    --password-stdin
  :rules:
  - :if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG
  :retry:
    :max: 2
    :when:
    - runner_system_failure
    - scheduler_failure
    - data_integrity_failure
  :stage: build
  :script:
  - docker build --pull -t "$CI_REGISTRY_IMAGE/web:${CI_COMMIT_SHORT_SHA}" services/web
  - if [ -z "$CI_COMMIT_TAG" ]; then docker tag "$CI_REGISTRY_IMAGE/web:${CI_COMMIT_SHORT_SHA}"
    "$CI_REGISTRY_IMAGE/web:latest"; fi
  - docker push "$CI_REGISTRY_IMAGE/web:${CI_COMMIT_SHORT_SHA}"
  - if [ -z "$CI_COMMIT_TAG" ]; then docker push "$CI_REGISTRY_IMAGE/web:latest";
    fi
  - if [ -n "$CI_COMMIT_TAG" ]; then docker tag "$CI_REGISTRY_IMAGE/web:${CI_COMMIT_SHORT_SHA}"
    "$CI_REGISTRY_IMAGE/web:${CI_COMMIT_TAG}"; fi
  - if [ -n "$CI_COMMIT_TAG" ]; then docker push "$CI_REGISTRY_IMAGE/web:${CI_COMMIT_TAG}";
    fi
:container_scanning:
  :rules:
  - :when: never
:.container-scan-base:
  :extends: container_scanning
  :stage: scan
  :needs: []
  :retry:
    :max: 2
    :when:
    - runner_system_failure
    - scheduler_failure
    - data_integrity_failure
  :allow_failure: true
  :variables:
    :CS_DISABLE_LANGUAGE_VULNERABILITY_SCAN: 'false'
  :artifacts:
    :reports:
      :container_scanning: gl-container-scanning-report.json
      :cyclonedx: "**/gl-sbom-*.cdx.json"
    :paths:
    - gl-container-scanning-report.json
    - "**/gl-sbom-*.cdx.json"
:container_scan_attacker:
  :extends: ".container-scan-base"
  :needs:
  - build_attacker
  :rules:
  - :if: "$CI_COMMIT_TAG"
    :variables:
      :CS_IMAGE: "$CI_REGISTRY_IMAGE/attacker:$CI_COMMIT_TAG"
  - :if: $CI_COMMIT_BRANCH == "main"
    :variables:
      :CS_IMAGE: "$CI_REGISTRY_IMAGE/attacker:$CI_COMMIT_SHORT_SHA"
  :variables:
    :GIT_STRATEGY: fetch
    :CS_DOCKERFILE_PATH: services/attacker/Dockerfile
:container_scan_ids:
  :extends: ".container-scan-base"
  :needs:
  - build_ids
  :rules:
  - :if: "$CI_COMMIT_TAG"
    :variables:
      :CS_IMAGE: "$CI_REGISTRY_IMAGE/ids:$CI_COMMIT_TAG"
  - :if: $CI_COMMIT_BRANCH == "main"
    :variables:
      :CS_IMAGE: "$CI_REGISTRY_IMAGE/ids:$CI_COMMIT_SHORT_SHA"
  :variables:
    :GIT_STRATEGY: fetch
    :CS_DOCKERFILE_PATH: services/ids/Dockerfile
:container_scan_web:
  :extends: ".container-scan-base"
  :needs:
  - build_web
  :rules:
  - :if: "$CI_COMMIT_TAG"
    :variables:
      :CS_IMAGE: "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_TAG"
  - :if: $CI_COMMIT_BRANCH == "main"
    :variables:
      :CS_IMAGE: "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHORT_SHA"
  :variables:
    :GIT_STRATEGY: fetch
    :CS_DOCKERFILE_PATH: services/web/Dockerfile
:dependency_scan:
  :stage: scan
  :image: python:3.12-slim
  :rules:
  - :if: $CI_COMMIT_BRANCH == "main"
  :before_script:
  - python -m pip install --upgrade pip
  - pip install pip-audit
  - pip install -e ids_iforest_package/
  :script:
  - pip-audit -f json -o pip-audit.json || true
  :allow_failure: true
  :artifacts:
    :paths:
    - pip-audit.json
    :expire_in: 1 week
:build_pypi_dist:
  :stage: build
  :image: python:3.12-slim
  :rules:
  - :if: "$CI_COMMIT_TAG"
  :before_script:
  - python -m pip install -U pip build
  :script:
  - cd ids_iforest_package
  - python -m build
  :artifacts:
    :paths:
    - ids_iforest_package/dist/
    :expire_in: 1 week
:publish_to_pypi:
  :stage: deploy
  :image: python:3.12-slim
  :dependencies:
  - build_pypi_dist
  :rules:
  - :if: "$CI_COMMIT_TAG"
  :id_tokens:
    :PYPI_ID_TOKEN:
      :aud: pypi
  :environment:
    :name: release
  :variables:
    :PIP_DISABLE_PIP_VERSION_CHECK: '1'
    :TWINE_NON_INTERACTIVE: '1'
  :before_script:
  - python -m pip install -U pip twine
  :script:
  - twine check --strict ids_iforest_package/dist/*
  - twine upload ids_iforest_package/dist/*
:pages:
  :stage: deploy
  :dependencies:
  - unit_tests
  :rules:
  - :if: $CI_COMMIT_BRANCH == "main"
  :script:
  - mv htmlcov public
  :artifacts:
    :paths:
    - public
    :expire_in: 30 days
stages:
- test
include:
- template: Security/Dependency-Scanning.gitlab-ci.yml
